# A tag push is what makes a release; nothing here decides the version. The tag grammar is
# not reimplemented in YAML either — `cos.mjs check-tag` prints `prerelease` or `release`,
# and this file reads that. Two copies of a grammar drift, and the one in a workflow drifts
# unobserved because nobody runs it locally.
#
# `contents: write` is the narrowest thing that can create a release, and it is the only
# permission granted. Building the wheel needs `uv` — the one third-party action here,
# pinned the same way `pr.yml` pins its — but not Node: Reflex downloads its own Node/Bun to
# export the frontend, so the runner needs no JavaScript toolchain preinstalled. `gh` is
# preinstalled, so attaching the built assets to the release needs nothing further.
#
# A wheel with no `coscc/_web/` in it still builds, still installs, and just has no
# frontend: `uv build` does not know that directory is supposed to exist, and
# `pyproject.toml` declares no package data on purpose. `scripts/build_wheel.sh` is where the
# copy steps and the guard after them live, and says why each one is there.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: The tag follows the grammar, and says which kind it is
        id: kind
        run: |
          set -euo pipefail
          kind=$(node .claude/scripts/cos.mjs check-tag "$GITHUB_REF_NAME")
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

      # A release built from a tag that disagrees with pyproject.toml would ship a number
      # nothing else in the repository carries. This step still only asks `cos.mjs`; it adds
      # nothing more than reading the version back out of what `cos.mjs` already printed, so
      # later steps that need the plain X.Y.Z (to name the wheel, and to bake into
      # install.sh) do not parse the tag or pyproject.toml a second time.
      - name: The tag agrees with the five declared versions
        id: version
        run: |
          set -euo pipefail
          out=$(node .claude/scripts/cos.mjs check-version)
          echo "$out"
          echo "version=${out%% *}" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: '3.14'

      # The recipe itself lives in `scripts/build_wheel.sh`, with the reasons for each copy
      # step beside it: the board's *Build local* button runs the same file on `origin/main`
      # (`.cos/0068_updating-the-app-is-a-manual-reinstall` R6), and two copies of a recipe
      # drift. It ends with `scripts/check_wheel.py`, which refuses a wheel that would install
      # and not work — no frontend, no harness, no build stamp — and prints the wheel's path
      # on its last line.
      - name: Build the wheel, and refuse one that would install and not work
        id: wheel
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          wheel=$(bash scripts/build_wheel.sh --out dist | tail -n 1)
          want="dist/coscc-${VERSION}-py3-none-any.whl"
          if [ "$wheel" != "$want" ]; then
            echo "::error::built $wheel, expected $want — the wheel's name is not what this workflow assumed" >&2
            exit 1
          fi
          echo "wheel=$wheel" >> "$GITHUB_OUTPUT"

      # scripts/install.sh (spec.md R9, plan.md step 8) is a template carrying two
      # placeholders, read from that file on 2026-09-22: `@@COSCC_VERSION@@` and
      # `@@COSCC_WHEEL_SHA256@@`. Both names must stay in step with `scripts/install.sh:36-37`.
      # A mismatch does not fail here — `sed` substitutes nothing and exits 0 — but the
      # script refuses to run while either placeholder is still in place, so a release built
      # with the wrong names ships an installer that stops on its first line. That refusal is
      # the only thing standing between a renamed placeholder and a silently broken release.
      - name: SHA256SUMS, and the wheel's checksum baked into install.sh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          WHEEL: ${{ steps.wheel.outputs.wheel }}
        run: |
          set -euo pipefail
          wheel_name=$(basename "$WHEEL")
          # Hashed from inside dist/ so SHA256SUMS names the wheel the way it is attached to
          # the release — bare, not prefixed with dist/ — and `sha256sum -c` works against
          # the three assets exactly as downloaded.
          (cd "$(dirname "$WHEEL")" && sha256sum "$wheel_name") > SHA256SUMS
          wheel_sha256=$(awk '{print $1}' SHA256SUMS)
          sed \
            -e "s/@@COSCC_VERSION@@/$VERSION/g" \
            -e "s/@@COSCC_WHEEL_SHA256@@/$wheel_sha256/g" \
            scripts/install.sh > install.sh
          sha256sum install.sh >> SHA256SUMS

      - name: Create the release, with the wheel, the installer and their checksums attached
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ steps.kind.outputs.kind }}
          WHEEL: ${{ steps.wheel.outputs.wheel }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "$WHEEL" install.sh SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $([ "$KIND" = prerelease ] && echo --prerelease || echo --latest)
