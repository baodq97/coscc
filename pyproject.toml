[project]
name = "coscc"
version = "0.14.0"
description = "Web app that lists, creates and resumes Claude Code sessions across projects"
# `install.sh` installs `uv` first, and `uv` provisions this interpreter, so no machine needs
# 3.14 already.
requires-python = ">=3.14"
dependencies = [
    "claude-agent-sdk>=0.2.161",
    "reflex>=0.9.12",
    "fastapi>=0.141.1",
    "argon2-cffi>=25.1.0",
    "reflex-base>=0.9.12",
    "uvicorn>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the package sits at the repo root beside rxconfig.py, the only layout Reflex
# documents; uv's default is `src/`.
module-root = ""
module-name = "coscc"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.63.0",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[project.scripts]
# `spec.md` R2. The entry point also pins how the app is served: one ASGI app on one
# port with the compiled frontend mounted, not `reflex run` -- see run.py. That port was
# loopback-only until 0011; the default is now 0.0.0.0.
coscc = "coscc.run:main"
# Building through here rather than calling `reflex export` directly is what leaves the
# fingerprint that `run.py` checks. See coscc/build.py.
coscc-build = "coscc.build:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# `BLE`, `S110`, `S112`: a blind `except` logs its traceback, or says in a `noqa` why not.
select = ["F", "BLE", "S110", "S112", "RUF100"]

[tool.ty.src]
# Tests are checked by running them.
exclude = ["tests/**"]

[tool.ty.rules]
# Reflex `Var` fields: ty does not follow them, so these three report false findings.
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
not-subscriptable = "ignore"

[[tool.ty.overrides]]
# Reflex components and state: `str + Var`, `~Var` and event namespaces type as errors.
include = ["coscc/screens/**", "coscc/state/**"]
rules = { unresolved-attribute = "ignore", unsupported-operator = "ignore", deprecated = "ignore", no-matching-overload = "ignore", invalid-return-type = "ignore" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
