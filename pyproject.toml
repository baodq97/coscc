[project]
name = "cos-baodo-app"
version = "0.0.1"
description = "Web app that lists, creates and resumes Claude Code sessions across projects"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "aiohttp>=3.9",
    "reflex>=0.9.11.post1",
    "fastapi>=0.141.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
