[project]
name = "cos-baodo"
version = "0.0.1"
description = "Web app that lists, creates and resumes Claude Code sessions across projects"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "reflex>=0.9.11.post1",
    "fastapi>=0.141.1",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the package sits at the repo root beside rxconfig.py, because that is the
# only layout Reflex documents (`spec.md` R1). uv's default is `src/`, so this line is
# what reconciles the two.
module-root = ""
module-name = "cos_baodo"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.63.0",
]

[project.scripts]
# `spec.md` R2. The entry point also pins how the app is served: one ASGI app on one
# loopback port with the compiled frontend mounted, not `reflex run` -- see run.py.
cos-baodo = "cos_baodo.run:main"
# Building through here rather than calling `reflex export` directly is what leaves the
# fingerprint that `run.py` and `scripts/verify_0003.py` check. See cos_baodo/build.py.
cos-build = "cos_baodo.build:main"
