[project]
name = "coscc"
version = "0.14.0"
description = "Web app that lists, creates and resumes Claude Code sessions across projects"
# `install.sh` installs `uv` first, and `uv` provisions this interpreter, so no machine needs
# 3.14 already.
requires-python = ">=3.14"
dependencies = [
    "claude-agent-sdk>=0.2.161",
    "reflex>=0.9.12",
    "fastapi>=0.141.1",
    "argon2-cffi>=25.1.0",
    "reflex-base>=0.9.12",
    "uvicorn>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the package sits at the repo root beside rxconfig.py, the only layout Reflex
# documents; uv's default is `src/`.
module-root = ""
module-name = "coscc"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.63.0",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[project.scripts]
# `spec.md` R2. The entry point also pins how the app is served: one ASGI app on one
# port with the compiled frontend mounted, not `reflex run` -- see run.py. That port was
# loopback-only until 0011; the default is now 0.0.0.0.
coscc = "coscc.run:main"
# Building through here rather than calling `reflex export` directly is what leaves the
# fingerprint that `run.py` checks. See coscc/build.py.
coscc-build = "coscc.build:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# `BLE`, `S110`, `S112`: a blind `except` logs its traceback, or says in a `noqa` why not.
# `C901`, `PLR0915`: a function stays small; its `noqa` marks one still to split, and `RUF100`
# drops the mark once it is. `ARG`: an argument is read, or named `_x` for a caller's signature.
select = ["F", "BLE", "S110", "S112", "RUF100", "C901", "PLR0915", "ARG"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.pylint]
max-statements = 60

[tool.ruff.lint.per-file-ignores]
# A fake takes the arguments of what it stands in for.
"tests/**" = ["ARG"]

[tool.ty.src]
# Tests are checked by running them.
exclude = ["tests/**"]

[[tool.ty.overrides]]
# Reflex components, state and the page app: ty does not follow `Var` fields, so `str + Var`,
# `~Var`, event namespaces and a `Var` passed or assigned where its value is typed report errors.
include = ["coscc/screens/**", "coscc/state/**", "coscc/coscc.py"]
rules = { unresolved-attribute = "ignore", unsupported-operator = "ignore", deprecated = "ignore", no-matching-overload = "ignore", invalid-return-type = "ignore", invalid-argument-type = "ignore", invalid-assignment = "ignore", not-subscriptable = "ignore" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
