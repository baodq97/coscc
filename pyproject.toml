[project]
name = "coscc"
version = "0.4.1"
description = "Web app that lists, creates and resumes Claude Code sessions across projects"
# Every measurement this repository records is taken on the interpreter in
# `.python-version`, and after 0007 that is 3.14. A floor naming an older one would be the
# same kind of untrue sentence this unit exists to remove. 0011 gives this app its first
# downstream — someone running install.sh on a machine of their own — but the floor still
# does not shut them out: install.sh installs `uv` before anything else, and `uv` provisions
# whatever interpreter this line names, so nobody downstream needs 3.14 already on the
# machine for this to work. Measured 2026-09-22: `uv python list --only-downloads`
# offers cpython-3.14.7, and `uv tool install` takes `--no-python-downloads` to turn
# that off, so it is on by default.
requires-python = ">=3.14"
dependencies = [
    "claude-agent-sdk>=0.2.157",
    "reflex>=0.9.12",
    "fastapi>=0.141.1",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the package sits at the repo root beside rxconfig.py, because that is the
# only layout Reflex documents (`spec.md` R1). uv's default is `src/`, so this line is
# what reconciles the two.
module-root = ""
module-name = "coscc"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.63.0",
]

[project.scripts]
# `spec.md` R2. The entry point also pins how the app is served: one ASGI app on one
# port with the compiled frontend mounted, not `reflex run` -- see run.py. That port was
# loopback-only until 0011; the default is now 0.0.0.0.
coscc = "coscc.run:main"
# Building through here rather than calling `reflex export` directly is what leaves the
# fingerprint that `run.py` and `scripts/verify_0003.py` check. See coscc/build.py.
coscc-build = "coscc.build:main"
