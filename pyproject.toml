[project]
name = "coscc"
version = "0.14.0"
description = "Web app that lists, creates and resumes Claude Code sessions across projects"
# `install.sh` installs `uv` first, and `uv` provisions this interpreter, so no machine needs
# 3.14 already.
requires-python = ">=3.14"
dependencies = [
    "claude-agent-sdk>=0.2.161",
    "fastapi>=0.141.1",
    "argon2-cffi>=25.1.0",
    "uvicorn>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the package sits at the repo root; uv's default is `src/`.
module-root = ""
module-name = "coscc"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.63.0",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[project.scripts]
# One ASGI app on one port, behind the login guard: see run.py.
coscc = "coscc.run:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# `BLE`, `S110`, `S112`: a blind `except` logs its traceback, or says in a `noqa` why not.
# `C901`, `PLR0915`: a function stays small; its `noqa` marks one still to split, and `RUF100`
# drops the mark once it is. `ARG`: an argument is read, or named `_x` for a caller's signature.
# `PIE794`: a class defines a field once.
# `RET505`-`RET508`, `PLR1702`: refuse first, so the main path runs unindented; `PLR1702` is a
# preview rule, so only the rules named in `select` turn on (`explicit-preview-rules`).
select = ["F", "BLE", "S110", "S112", "RUF100", "C901", "PLR0915", "ARG", "PIE794",
  "RET505", "RET506", "RET507", "RET508", "PLR1702"]
preview = true
explicit-preview-rules = true

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.pylint]
max-statements = 60
max-nested-blocks = 4

[tool.ruff.lint.per-file-ignores]
# A fake takes the arguments of what it stands in for.
"tests/**" = ["ARG"]

[tool.ty.src]
# Tests are checked by running them.
exclude = ["tests/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
# A test that hangs fails with its name instead of holding the run until a caller gives up.
timeout = 60
markers = ["real_loop: the loop runs as a real child, not in this process"]
