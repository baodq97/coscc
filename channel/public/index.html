<!doctype html>
<meta charset="utf-8">
<title>webchannel</title>
<style>
  :root { color-scheme: dark; --bg:#14161a; --panel:#1c1f26; --in:#2a3140; --out:#232830; --fg:#e6e8ec; --dim:#8b93a1; }
  * { box-sizing: border-box }
  body { margin:0; height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--fg);
         font:15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif }
  header { padding:10px 16px; border-bottom:1px solid #000; color:var(--dim); font-size:13px;
           display:flex; gap:12px; align-items:center }
  #dot { width:8px; height:8px; border-radius:50%; background:#c0392b }
  #dot.live { background:#27ae60 }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px }
  .msg { max-width:76ch; padding:9px 13px; border-radius:10px; white-space:pre-wrap; word-wrap:break-word }
  .in  { background:var(--in); align-self:flex-end }
  .out { background:var(--out); align-self:flex-start }
  .meta { color:var(--dim); font-size:12px; align-self:center }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid #000; background:var(--panel) }
  textarea { flex:1; resize:none; height:60px; padding:9px 12px; border-radius:8px; border:1px solid #333;
             background:#12141a; color:var(--fg); font:inherit }
  button { padding:0 20px; border-radius:8px; border:0; background:#3d6fd1; color:#fff; font:inherit; cursor:pointer }
  button:disabled { opacity:.5; cursor:default }
</style>

<header><span id="dot"></span><span id="state">connecting…</span><span id="sid"></span></header>
<div id="log"></div>
<form id="f">
  <textarea id="t" placeholder="Type a prompt. Enter sends, Shift+Enter adds a line." autofocus></textarea>
  <button id="b">Send</button>
</form>

<script>
  const log = document.getElementById('log')
  const dot = document.getElementById('dot')
  const state = document.getElementById('state')
  const sid = document.getElementById('sid')
  const form = document.getElementById('f')
  const box = document.getElementById('t')

  const add = (cls, text) => {
    const el = document.createElement('div')
    el.className = 'msg ' + cls
    el.textContent = text
    log.append(el)
    log.scrollTop = log.scrollHeight
  }

  // The page is a view, not the record. It starts empty on every reload; the transcript on
  // disk is what the work unit is measured against.
  add('meta', 'This page is a view. The transcript on disk is the record.')

  const es = new EventSource('/events')
  es.onopen = () => { dot.classList.add('live'); state.textContent = 'connected' }
  es.onerror = () => { dot.classList.remove('live'); state.textContent = 'disconnected — is the session still running?' }
  es.onmessage = (e) => {
    const ev = JSON.parse(e.data)
    if (ev.dir === 'meta') { sid.textContent = 'session ' + ev.session; return }
    if (ev.dir === 'out') add('out', ev.content)
  }

  form.onsubmit = async (e) => {
    e.preventDefault()
    const text = box.value.trim()
    if (!text) return
    box.value = ''
    add('in', text)
    try {
      const res = await fetch('/send', { method: 'POST', body: text })
      if (!res.ok) add('meta', 'send failed: HTTP ' + res.status)
    } catch (err) {
      add('meta', 'send failed: ' + err.message)
    }
  }

  box.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit() }
  })
</script>
