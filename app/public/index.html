<!doctype html>
<meta charset="utf-8">
<title>cos-baodo — sessions</title>
<!--
  The page holds no conversation state of its own (spec.md R6). On load it reads the
  workspace and session from the URL and refetches the history from disk, which is the
  deliberate answer to spec.md open question 5: in 0001 a reload lost everything, and
  here it cannot, because the page was never the thing holding it.
-->
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; display: grid;
         grid-template-columns: 300px 1fr; height: 100vh; }
  aside { border-right: 1px solid #8884; padding: 12px; overflow-y: auto; }
  main { display: flex; flex-direction: column; min-width: 0; }
  #log { flex: 1; overflow-y: auto; padding: 16px; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #8884; }
  input, select, button { font: inherit; padding: 6px 8px; }
  #text { flex: 1; }
  .msg { margin-bottom: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg b { display: block; font-size: 12px; opacity: .6; text-transform: uppercase; }
  .s { display: block; width: 100%; text-align: left; background: none; border: 0;
       padding: 6px; border-radius: 4px; cursor: pointer; }
  .s:hover { background: #8882; }
  .s[aria-current="true"] { background: #8883; font-weight: 600; }
  .s small { display: block; opacity: .55; }
  .s[disabled] { opacity: .45; cursor: not-allowed; }
  #err { color: #c00; padding: 0 16px; }
</style>

<aside>
  <label>Workspace<br><select id="ws"></select></label>
  <p><button id="new">+ New session</button></p>
  <div id="list"></div>
</aside>

<main>
  <div id="log"></div>
  <div id="err"></div>
  <form id="f">
    <input id="text" placeholder="Message…" autocomplete="off" autofocus>
    <button>Send</button>
  </form>
</main>

<script type="module">
const $ = (id) => document.getElementById(id)
const url = new URL(location.href)
let cwd = url.searchParams.get('cwd') || ''
let sid = url.searchParams.get('session') || null

const remember = () => {
  // The URL is the only state the page keeps, so a reload — or a bookmark — lands back
  // on the same conversation and refetches it.
  const u = new URL(location.href)
  cwd ? u.searchParams.set('cwd', cwd) : u.searchParams.delete('cwd')
  sid ? u.searchParams.set('session', sid) : u.searchParams.delete('session')
  history.replaceState(null, '', u)
}

const say = (role, text, el) => {
  const div = el || Object.assign(document.createElement('div'), { className: 'msg' })
  if (!el) { div.append(Object.assign(document.createElement('b'), { textContent: role })) }
  const body = el ? el.lastChild : div.appendChild(document.createElement('span'))
  body.textContent = text
  if (!el) $('log').append(div)
  $('log').scrollTop = $('log').scrollHeight
  return div
}

const fail = (m) => { $('err').textContent = m || '' }

async function loadWorkspaces() {
  const { workspaces } = await (await fetch('/api/workspaces')).json()
  $('ws').replaceChildren(...workspaces.map((w) =>
    Object.assign(document.createElement('option'), { value: w, textContent: w })))
  if (!workspaces.includes(cwd)) cwd = workspaces[0] || ''
  $('ws').value = cwd
}

async function loadSessions() {
  const r = await (await fetch(`/api/sessions?cwd=${encodeURIComponent(cwd)}&limit=50`)).json()
  if (r.error) return fail(r.error)
  $('list').replaceChildren(...r.sessions.map((s) => {
    const b = Object.assign(document.createElement('button'), { className: 's' })
    b.append(Object.assign(document.createElement('span'), { textContent: s.summary }))
    b.append(Object.assign(document.createElement('small'), {
      textContent: s.resumable ? s.session_id.slice(0, 8)
        : `${s.session_id.slice(0, 8)} — read only (not created here)`,
    }))
    b.toggleAttribute('disabled', !s.resumable)
    if (s.session_id === sid) b.setAttribute('aria-current', 'true')
    b.onclick = () => { sid = s.session_id; remember(); loadHistory(); loadSessions() }
    return b
  }))
}

async function loadHistory() {
  $('log').replaceChildren()
  if (!sid) return
  const r = await (await fetch(
    `/api/history?cwd=${encodeURIComponent(cwd)}&session_id=${encodeURIComponent(sid)}`)).json()
  if (r.error) return fail(r.error)
  for (const m of r.messages) say(m.role, m.text)
}

$('ws').onchange = () => { cwd = $('ws').value; sid = null; remember(); loadSessions(); loadHistory() }
$('new').onclick = () => { sid = null; remember(); $('log').replaceChildren(); loadSessions() }

$('f').onsubmit = async (e) => {
  e.preventDefault()
  const text = $('text').value.trim()
  if (!text) return
  $('text').value = ''
  fail('')
  say('user', text)
  const bubble = say('assistant', '')
  let acc = ''

  const res = await fetch('/api/send', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ cwd, text, session_id: sid }),
  })
  if (!res.ok) return fail((await res.json()).error)

  // NDJSON, so a line may arrive split across chunks. Hold the tail until it is whole.
  const reader = res.body.getReader()
  const dec = new TextDecoder()
  let buf = ''
  for (;;) {
    const { done, value } = await reader.read()
    if (done) break
    buf += dec.decode(value, { stream: true })
    const lines = buf.split('\n')
    buf = lines.pop()
    for (const line of lines) {
      if (!line.trim()) continue
      const ev = JSON.parse(line)
      if (ev.type === 'chunk') { acc += ev.text; say('assistant', acc, bubble) }
      else if (ev.type === 'error') fail(ev.error)
      else if (ev.type === 'done') { sid = ev.session_id; remember(); loadSessions() }
    }
  }
}

await loadWorkspaces()
remember()
await loadSessions()
await loadHistory()
</script>
